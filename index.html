<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ticket Drop Trainer</title>
    <style>
        body {
            margin: 0;
            background: #0f1016;
            color: #eceef6;
            font-family: system-ui, sans-serif;
        }

        #app {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px;
        }

        .card {
            background: #191b25;
            border: 1px solid #2e3243;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
        }

        .on {
            outline: 2px solid #8b6cff;
        }

        .pos {
            font-size: 48px;
            font-weight: 800;
            margin: 8px 0;
        }

        .bar {
            height: 10px;
            background: #222533;
            border-radius: 99px;
            overflow: hidden;
        }

        .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: #8b6cff;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            background: #2a2d3c;
            border: 1px solid #ff5d6c;
            color: #ffc2c7;
            padding: 11px 16px;
            border-radius: 12px;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: #000a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dialog {
            background: #191b25;
            border: 1px solid #2e3243;
            border-radius: 18px;
            padding: 20px;
            width: 320px;
            text-align: center;
        }

        .tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 14px 0;
        }

        .tiles button {
            font-size: 30px;
            padding: 14px 0;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        const app = document.querySelector('#app');

        const S = {
            settings: { diff: 'stadium', qty: 2 },  // what you picked on setupl survives between runs
            run: null                               // the current attempt; rebuilt from scratch each time
        };
        const DIFF = {
            arena: { label: 'Arena', lobby: 8, qMin: 800, qMax: 4000 },
            stadium: { label: 'Stadium', lobby: 8, qMin: 8000, qMax: 25000 },
            chaos: { label: 'Chaos', lobby: 8, qMin: 30000, qMax: 90000 }
        };

        let timers = [];    // every active timer id goes in here

        function every(ms, fn) {
            const t = setInterval(fn, ms);
            timers.push(t);     // ____ add t to the timers list
            return t;
        }

        function after(ms, fn) {
            const t = setTimeout(fn, ms);
            timers.push(t);  // ____ same
            return t;
        }

        function clearTimers() {
            timers.forEach(t => clearInterval(t));  // ____ loop over timers and stop each one (clearInterval works on both kinds)
            timers = [];                            // ____ then reset timers to an empty array
        }

        function ri(a, b) {
            return Math.floor(a + Math.random() * (b - a + 1));     // random whole number from a to b
        }

        const SYMS = ['*', '●', '▲', '◼︎', '❤︎', '◆'];

        function shuffle(a) {                       // mixes up an array in place
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];        // swap two items
            }
            return a;
        }

        function showVerify() {
            const target = SYMS[ri(0, 5)];              // the symbol they must tap
            const tiles = shuffle([...SYMS]);           // [...SYMS] copies it, sot the original stays in order
            let left = 5;

            document.querySelector('#modal').innerHTML = `
            <div class="overlay"><div class="dialog">
                <h3>Are you still there?</h3>
                <p>Tap the <b>${target}</b> to keep your place.</p>
                <div class="tiles">${tiles.map(s => `<button data-s="${s}">${s}</button>`).join('')}</div>
                <div>Time left: <b id="vl">${left}</b>s</div>
                </div></div>
                `;

            const iv = every(1000, () => {
                left--;
                document.querySelector('#vl').textContent = left;
                if (left <= 0) {
                    close();
                    S.run.pos += S.run.qOrig * 0.3;                 // big penalty
                    S.run.mistakes.push('Missed an "are you still there?" check');
                    toast('Check timed out, You lost ground in line.');
                }
            });

            function close() {
                document.querySelector('#modal').innerHTML = '';    // remove the pop-up
                clearInterval(iv);
            }

            document.querySelectorAll('.tiles button').forEach(b => {
                b.onclick = () => {
                    close();
                    if (b.dataset.s === target) {                                       // did they tap the right symbol? compare b.dataset.s to target
                        toast('Verified ✓');
                    } else {
                        S.run.pos += S.run.qOrig * 0.15;                              // smaller penalty: 15% of the original line
                        S.run.mistakes.push('Pushed the wrong tile in "are you still there?" check');                                   // a label for this mistake
                        toast('Wrong tile. Pushed back in line.');
                    }
                };
            });
        }

        function toast(msg) {
            const t = document.createElement('div');    // make a new element
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);               // add it to the page
            setTimeout(() => t.remove(), 2300);         // remove it after 2.3 seconds
        }

        function renderQueue() {
            clearTimers();
            S.run.qOrig = ri(S.run.d.qMin, S.run.d.qMax);     // starting place in line: use the difficulty's qMin and qMax
            S.run.pos = S.run.qOrig;

            app.innerHTML = `
            <div class="card">
                <h1>In line</h1>
                <div>People ahead of you</div>
                <div>The sale is live. Don't refresh, or you'll lose your place in line.</div>
                <div class="pos" id="pos"></div>
                <div class="bar"><i id="bar"></i></div>
                <button id="refresh">↩︎ Page looks stuck? Refresh</button>
            </div>
            <div id="modal"></div>
            `;

            const step = S.run.qOrig / (20 * 5);    // about 20 seconds at 5 ticks per second

            every(200, () => {
                S.run.pos -= step * (0.3 + Math.random() * 1.4);    // uneven speed, like a real queue
                document.querySelector('#pos').textContent = Math.max(0, Math.ceil(S.run.pos)).toLocaleString();  // whole number with commas
                document.querySelector('#bar').style.width = (1 - S.run.pos / S.run.qOrig) * 100 + '%';  // percent of the line you've gotten through
                if (S.run.pos <= 0) renderResults();
            });

            after(ri(3000, 15000), showVerify);     // pops up between 3 and 15 seconds into the queue

            document.querySelector('#refresh').onclick = () => {
                S.run.pos = S.run.qOrig * (0.9 + Math.random() * 0.15);     // back near the start of the line
                S.run.mistakes.push('Refreshed during the live queue');     // log it once, per click
                toast('You refreshed and got sent to the back of the line.');
            }
        }

        function startRun() {
            S.run = {
                d: DIFF[S.settings.diff],             // look up the difficulty object using the chosen setting
                qty: S.settings.qty,                  // the chosen quantity
                mistakes: []
            };
            renderLobby();
        }

        function renderSetup() {

            clearTimers();
            //1. Draw the screen by replacing everything inside #app with new HTML.
            //   Backticks (`) allow a multi-line string.
            app.innerHTML = `
            <div class="card">
                <h1>Ticket Drop Trainer</h1>
                <p>Practice a big onsale until it's muscle memory.</p>
                <button class="diff ${S.settings.diff === 'arena' ? 'on' : ''}" data-v="arena">Arena</button>
                <button class="diff ${S.settings.diff === 'stadium' ? 'on' : ''}" data-v="stadium">Stadium</button>
                <button class="diff ${S.settings.diff === 'chaos' ? 'on' : ''}" data-v="chaos">Chaos</button>
                <p>Tickets:</p>
                ${[1, 2, 3, 4].map(n => `<button class="qty ${S.settings.qty === n ? 'on' : ''}" data-v="${n}">${n}</button>`).join('')}
                <button id="start">Start practice drop</button>
            </div>
            `;

            //2. Wire up the button, It only exists now, after the line above ran.
            document.querySelectorAll('.diff').forEach(b => {
                b.onclick = () => { S.settings.diff = b.dataset.v; renderSetup(); };
            });
            document.querySelectorAll('.qty').forEach(b => {                                // 1. '.qty' in place of '.diff'
                b.onclick = () => { S.settings.qty = +b.dataset.v; renderSetup(); };        // 2. set qty 3. the + makes it a number
            });
            document.querySelector('#start').onclick = startRun;

        }

        function renderLobby() {

            clearTimers();
            let left = S.run.d.lobby;
            //1. Draw the screen by replacing everything inside #app with new HTML.
            //   Backticks (`) allow a multi-line string.
            app.innerHTML = `
            <div class="card">
                <h1>Waiting room</h1>
                <p>${S.run.d.label} &middot; ${S.run.qty} tickets</p>
                <div id="cd">${left}</div>
                <button id="quit">Quit</button>
            </div>
            `;

            every(1000, () => {
                left--;                                             // one second passed
                document.querySelector('#cd').textContent = left;   // update just the number, not the whole screen
                if (left <= 0) {
                    S.run.t0 = performance.now();                   // the moment the "sale" starts
                    renderQueue();                                // becomes renderQueue() in the next step
                }
            });

            //2. Wire up the button, It only exists now, after the line above ran.
            document.querySelector('#quit').onclick = renderSetup;
        }

        function renderResults() {

            clearTimers();
            //1. Draw the screen by replacing everything inside #app with new HTML.
            //   Backticks (`) allow a multi-line string.
            app.innerHTML = `
            <div class="card">
                <h1>Results</h1>
                <p>Practice a big onsale until it's muscle memory.</p>
                <button id="play-again">Play again</button>
            </div>
            `;

            //2. Wire up the button, It only exists now, after the line above ran.
            document.querySelector('#play-again').onclick = renderSetup;
        }

        //3. Kick things off when the page loads.
        renderSetup();


    </script>
</body>

</html>
