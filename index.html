<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ticket Drop Trainer</title>
    <style>
        body {
            margin: 0;
            background: #0f1016;
            color: #eceef6;
            font-family: system-ui, sans-serif;
        }

        #app {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px;
        }

        .card {
            background: #191b25;
            border: 1px solid #2e3243;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
        }

        .on {
            outline: 2px solid #8b6cff;
        }

        .pos {
            font-size: 48px;
            font-weight: 800;
            margin: 8px 0;
        }

        .bar {
            height: 10px;
            background: #222533;
            border-radius: 99px;
            overflow: hidden;
        }

        .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: #8b6cff;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            background: #2a2d3c;
            border: 1px solid #ff5d6c;
            color: #ffc2c7;
            padding: 11px 16px;
            border-radius: 12px;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: #000a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dialog {
            background: #191b25;
            border: 1px solid #2e3243;
            border-radius: 18px;
            padding: 20px;
            width: 320px;
            text-align: center;
        }

        .tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 14px 0;
        }

        .tiles button {
            font-size: 30px;
            padding: 14px 0;
        }

        .stage {
            background: #2a2c3a;
            border-radius: 10px 10px 40px 40px;
            text-align: center;
            padding: 10px;
            font-weight: 800;
            letter-spacing: .3em;
            font-size: 12px;
            color: #9097ad;
            margin-bottom: 10px;
        }

        .tierlabel {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #9097ad;
            margin: 10px 0 5px;
        }

        .secgrid {
            display: grid;
            gap: 6px;
        }

        .g4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .g5 {
            grid-template-columns: repeat(5, 1fr);
        }

        .g6 {
            grid-template-columns: repeat(6, 1fr);
        }

        .sec {
            background: #222533;
            border: 1.5px solid #2e3243;
            border-radius: 9px;
            padding: 7px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: inherit;
            font-size: 12px;
        }

        .sec span {
            color: #9097ad;
            font-size: 11px;
        }

        .av {
            display: block;
            width: 80%;
            height: 4px;
            background: #ffffff14;
            border-radius: 9px;
            overflow: hidden;
        }

        .av u {
            display: block;
            height: 100%;
            background: #8b6cff;
        }

        .seatgrid {
            display: grid;
            gap: 4px;
            margin: 12px 0;
        }

        .rl {
            font-size: 11px;
            color: #9097ad;
            display: flex;
            align-items: center;
        }

        .seat {
            aspect-ratio: 1;
            border-radius: 5px 5px 3px 3px;
            border: none;
            padding: 0;
            min-width: 18px;
        }

        .seat.a {
            background: #8b6cff;
            cursor: pointer;
            /* open */
        }

        .seat.x {
            background: #2c2f3e;
            /* taken */
        }

        .seat.s {
            background: #3ecf8e;
            /* yours */
        }

        .sec.sold {
            opacity: .25;
            cursor: not-allowed;
        }

        .locked .sec span {
            filter: blur(5px);
        }

        .hold {
            background: #8b6cff1f;
            border: 1px solid #8b6cff55;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }

        .hold.urgent {
            background: #ff5d6c22;
            border-color: #ff5d6c;
        }

        .err {
            outline: 2px solid #ff5d6c;
            border-radius: 8px;
        }

        .grade {
            font-size: 84px;
            font-weight: 800;
            line-height: 1;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat {
            background: #222533;
            border-radius: 12px;
            padding: 10px 12px;
        }

        .stat span {
            display: block;
            font-size: 12px;
            color: #9097ad;
        }

        .stat b {
            font-size: 19px;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        const app = document.querySelector('#app');

        const S = {
            settings: { diff: 'stadium', qty: 2 },  // what you picked on setupl survives between runs
            run: null                               // the current attempt; rebuilt from scratch each time
        };
        const DIFF = {
            arena: { label: 'Arena', lobby: 8, qMin: 800, qMax: 4000 },
            stadium: { label: 'Stadium', lobby: 8, qMin: 8000, qMax: 25000 },
            chaos: { label: 'Chaos', lobby: 8, qMin: 30000, qMax: 90000 }
        };

        let timers = [];    // every active timer id goes in here

        function every(ms, fn) {
            const t = setInterval(fn, ms);
            timers.push(t);     // ____ add t to the timers list
            return t;
        }

        function after(ms, fn) {
            const t = setTimeout(fn, ms);
            timers.push(t);  // ____ same
            return t;
        }

        function clearTimers() {
            timers.forEach(t => clearInterval(t));  // ____ loop over timers and stop each one (clearInterval works on both kinds)
            timers = [];                            // ____ then reset timers to an empty array
        }

        function load(key, fallback) {
            try {
                const v = localStorage.getItem(key);        //stored as text, or null if nothing saved yet
                return v ? JSON.parse(v) : fallBack;        // turn the text back into an array/object
            } catch (e) {
                return fallback;                            // storage blocked or broken: just use the fallback
            }
        }

        function store(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));       // turn the array/object into text and save
            } catch (e) { }                                              // if saving fails, the game still works
        }

        function ri(a, b) {
            return Math.floor(a + Math.random() * (b - a + 1));     // random whole number from a to b
        }

        function snipeCheck() {
            const secs = (performance.now() - S.run.pickStart) / 1000;      // seconds since picking started
            const chance = Math.min(0.5, 0.06 * (1 + secs / 10));           // 6% at the start, growing, capped at 50%
            return Math.random() < chance;                                  // true = someone beat you
        }

        const TIPS = {
            'Refreshed during the live queue': 'Never refresh once the line is live, The page updates on its own.',
            'Missed an "are you still there?" check': 'Keep the queue tab in front and stay near your device.',
            'Pushed the wrong tile in "are you still there?" check': 'Slow down for a split second on checks. A wrong tap costs more than a careful one.',
            'Mistyped the presale code': 'Paste your code from your notes instead of typing it',
            'Skipped the ticket protection question': 'Decide on ticket protection before the sale so it takes one tap.',
            'Forgot to tick the terms box': "Look for the terms checkbox. It's the easiest field to miss.",
            'Wrong or missing CVV': 'Know your CVV by heart, or keep it in your notes.'
        };

        const SYMS = ['*', '●', '▲', '◼︎', '❤︎', '◆'];

        const ROWS = 'ABCDEFGHIJKLM';

        function shuffle(a) {                       // mixes up an array in place
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];        // swap two items
            }
            return a;
        }

        function showVerify() {
            const target = SYMS[ri(0, 5)];              // the symbol they must tap
            const tiles = shuffle([...SYMS]);           // [...SYMS] copies it, sot the original stays in order
            let left = 5;

            document.querySelector('#modal').innerHTML = `
            <div class="overlay"><div class="dialog">
                <h3>Are you still there?</h3>
                <p>Tap the <b>${target}</b> to keep your place.</p>
                <div class="tiles">${tiles.map(s => `<button data-s="${s}">${s}</button>`).join('')}</div>
                <div>Time left: <b id="vl">${left}</b>s</div>
                </div></div>
                `;

            const iv = every(1000, () => {
                left--;
                document.querySelector('#vl').textContent = left;
                if (left <= 0) {
                    close();
                    S.run.pos += S.run.qOrig * 0.3;                 // big penalty
                    S.run.mistakes.push('Missed an "are you still there?" check');
                    toast('Check timed out, You lost ground in line.');
                }
            });

            function close() {
                document.querySelector('#modal').innerHTML = '';    // remove the pop-up
                clearInterval(iv);
            }

            document.querySelectorAll('.tiles button').forEach(b => {
                b.onclick = () => {
                    close();
                    if (b.dataset.s === target) {                                       // did they tap the right symbol? compare b.dataset.s to target
                        toast('Verified ✓');
                    } else {
                        S.run.pos += S.run.qOrig * 0.15;                              // smaller penalty: 15% of the original line
                        S.run.mistakes.push('Pushed the wrong tile in "are you still there?" check');                                   // a label for this mistake
                        toast('Wrong tile. Pushed back in line.');
                    }
                };
            });
        }

        function toast(msg) {
            const t = document.createElement('div');    // make a new element
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);               // add it to the page
            setTimeout(() => t.remove(), 2300);         // remove it after 2.3 seconds
        }

        function renderQueue() {
            clearTimers();
            S.run.qOrig = ri(S.run.d.qMin, S.run.d.qMax);     // starting place in line: use the difficulty's qMin and qMax
            S.run.pos = S.run.qOrig;

            app.innerHTML = `
            <div class="card">
                <h1>In line</h1>
                <div>People ahead of you</div>
                <div>The sale is live. Don't refresh, or you'll lose your place in line.</div>
                <div class="pos" id="pos"></div>
                <div class="bar"><i id="bar"></i></div>
                <button id="refresh">↩︎ Page looks stuck? Refresh</button>
            </div>
            <div id="modal"></div>
            `;

            const step = S.run.qOrig / (20 * 5);    // about 20 seconds at 5 ticks per second

            every(200, () => {
                S.run.pos -= step * (0.3 + Math.random() * 1.4);    // uneven speed, like a real queue
                document.querySelector('#pos').textContent = Math.max(0, Math.ceil(S.run.pos)).toLocaleString();  // whole number with commas
                document.querySelector('#bar').style.width = (1 - S.run.pos / S.run.qOrig) * 100 + '%';  // percent of the line you've gotten through
                if (S.run.pos <= 0) renderPick();
            });

            after(ri(3000, 15000), showVerify);     // pops up between 3 and 15 seconds into the queue

            document.querySelector('#refresh').onclick = () => {
                S.run.pos = S.run.qOrig * (0.9 + Math.random() * 0.15);     // back near the start of the line
                S.run.mistakes.push('Refreshed during the live queue');     // log it once, per click
                toast('You refreshed and got sent to the back of the line.');
            }
        }

        function renderPick() {
            clearTimers();
            S.run.pickStart = performance.now();
            S.run.secs = buildSections();

            app.innerHTML = `
                <div class="card">
                    <h1>Pick tickets</h1>
                    <p>You need ${S.run.qty} ticket(s).</p>
                    <form id="unlock">
                        <input id="code" placeholder="Enter presale code" autocomplete="off">
                        <button>Unlock</button>
                    </form>
                    <div id="pickArea" class="locked"></div>
                </div>
                `;

            document.querySelector('#unlock').onsubmit = e => {
                e.preventDefault();                                             // stop the page from reloading
                const typed = document.querySelector('#code').value.trim().toUpperCase();
                if (typed === S.run.code) {
                    S.run.unlocked = true;
                    S.run.unlockMs = performance.now() - S.run.pickStart;       // how fast you unlocked
                    document.querySelector('#unlock').remove();                 // hide the box
                    document.querySelector('#pickArea').classList.remove('locked');
                    toast('Unlocked!');
                } else {
                    S.run.mistakes.push('Mistyped the presale code');
                    toast("That code wasn't recognized.");
                }
            };

            S.run.view = null;
            drawMap();

            every(500, tickPick);


        }

        function buildSections() {
            const secs = [];

            function add(id, tier, price, rows, cols) {
                const cap = rows * cols;                        // total seats in this section
                secs.push({
                    id, tier, price, rows, cols, cap,
                    avail: Math.floor(cap * (0.35 + Math.random() * 0.55))
                });   // 35-90% still open
            }

            ['FLR A', 'FLR B', 'FLR C', 'FLR D'].forEach(x => add(x, 'floor', ri(32, 42) * 10, 6, 10));
            for (let i = 101; i <= 110; i++) add(String(i), 'lower', ri(18, 26) * 10, 8, 10);
            // ____ your turn: upper sections 201 through 212, tier 'upper', price ri(85, 140), 8 rows, 12 cols
            for (let i = 201; i <= 212; i++) add(String(i), 'upper', ri(85, 140), 8, 12);

            return secs;
        }

        function drawMap() {
            // builds one tier's label + grids of section buttons
            const tier = (label, t, cls) => `
            <div class="tierlabel">${label}</div>
            <div class="secgrid ${cls}">
                ${S.run.secs.filter(s => s.tier === t).map(s => `
                <button class="sec" data-id="${s.id}">
                    <b>${s.id}</b><span>$${s.price}</span>
                    <i class="av"><u style="width:${s.avail / s.cap * 100}%"></u></i>
                    </button>`).join('')}
                </div>`;

            document.querySelector(`#pickArea`).innerHTML = `
                <div class="stage">STAGE</div>
                ${tier('Floor', 'floor', 'g4')}
                ${tier('Lower level', 'lower', 'g5')}
                ${tier('Upper level', 'upper', 'g6')}
                 `;

            document.querySelectorAll('.sec').forEach(b => {
                b.onclick = () => {
                    if (!S.run.unlocked) { toast('Enter your presale code first.'); return; }
                    const s = S.run.secs.find(x => x.id === b.dataset.id);      // the section object for the button
                    openSection(s);
                };
            });
        }

        function openSection(s) {
            if (!s.seats) {                                 // only build seats once per section
                const n = s.rows * s.cols;
                s.seats = Array(n).fill('x');               // start with every seat taken...
                shuffle([...Array(n).keys()])              // ...then a shuffled list of seat numbers 0...n-1
                    .slice(0, s.avail)                          // take as many as are available
                    .forEach(i => s.seats[i] = 'a');            // and mark those open
            }
            S.run.view = { sec: s, sel: [] };               // which section you're looking at + your selected seats
            drawSeats();
        }

        function drawSeats() {
            const s = S.run.view.sec;
            let g = '';
            for (let r = 0; r < s.rows; r++) {
                g += `<div class="rl">${ROWS[r]}</div>`;         // row letter at the start of each row
                for (let c = 0; c < s.cols; c++) {
                    g += `<button class="seat" data-i="${r * s.cols + c}"></button>`;
                }
            }

            document.querySelector('#pickArea').innerHTML = `
                <button id="back">&larr; All sections</button>
                <h3>Section ${s.id} &middot; $${s.price} each</h3>
                <div class="seatgrid" style="grid-template-columns: 16px repeat(${s.cols}, 1fr)">${g}</div>
                <div id="selc"></div>
                <button id="gettix">Get tickets</button>
            `;

            document.querySelector('#back').onclick = () => { S.run.view = null; drawMap(); }

            document.querySelector('#gettix').onclick = () => {
                const sel = S.run.view.sel;

                if (snipeCheck()) {
                    sel.forEach(i => s.seats[i] = 'x');                 // those seats are gone
                    s.avail = s.seats.filter(v => v === 'a').length;    // recount what's left
                    S.run.view.sel = [];
                    S.run.snipes = (S.run.snipes || 0) + 1;
                    toast('Another fan checked out those seats first, Grab new ones, fast!');
                    updateSeats();
                    return;                                             // stop here: no checkout
                }

                // you got them!
                S.run.order = {
                    desc: `Section ${s.id} ・ Seats ${sel.map(i => ROWS[Math.floor(i / s.cols)] + (i % s.cols + 1)).join(', ')}`,
                    price: s.price,
                    qty: S.run.qty
                };
                renderCheckout();        // becomes renderCheckout() in Step 6
            };

            document.querySelectorAll('.seat').forEach(b => {
                b.onclick = () => {
                    const i = +b.dataset.i;
                    const sel = S.run.view.sel;
                    if (s.seats[i] !== 'a') return;                     //can't pick a taken seat
                    if (sel.includes(i)) {
                        S.run.view.sel = sel.filter(x => x !== i);                         // already selected:remove it (hint: filter)
                    } else {
                        sel.push(i);
                        if (sel.length > S.run.qty) sel.shift();        // over the limit: drop the oldest pick
                    }
                    updateSeats();
                };
            });

            updateSeats();
        }

        function renderCheckout() {
            clearTimers();
            const o = S.run.order;
            S.run.coStart = performance.now();
            S.run.pickMs = S.run.coStart - S.run.pickStart;     // how long picking took
            let left = 60;                                      // seconds your tickets are held

            app.innerHTML = `
            <div class="card">
                <h1>Checkout</h1>
                <div class="hold" id="hold">Tickets held for <b id="hl">${left}</b>s</div>
                <p><b>${o.desc}</b><br>${o.qty} * $${o.price} • Total $${(o.qty * o.price * 1.27).toFixed(2)} with fees</p>

                <div id="f-ins">
                    <p>Ticket protection:</p>
                    <label><input type="radio" name="ins" value="y"> Yes, protect my order</label><br>
                    <label><input type="radio" name="ins" value="n">No thanks</label>
                </div>

                <p>💳 Saved card ●●●● 4242</P>
                <input id="cvv" inputmode="numeric" maxlength="4" placeholder="Security code (CVV)">

                <p id="f-terms"><label><input type="checkbox" id="terms"> I agree to the Terms of Use</label></p>

                <button id="place">Place order</button>
                </div>
                `;

            every(1000, () => {
                left--;
                document.querySelector('#hl').textContent = left;
                if (left <= 10) document.querySelector('#hold').classList.add('urgent');
                if (left <= 0) {
                    finish(false, 'Your ticket hold expired before you placed the order.');
                }
            });

            document.querySelector('#place').onclick = () => {
                let bad = false;

                const ins = document.querySelector('input[name=ins]:checked');     //the picked radio, or null
                if (!ins) {
                    document.querySelector('#f-ins').classList.add('err');
                    S.run.mistakes.push('Skipped the ticket protection question');
                    bad = true;
                }

                if (!document.querySelector('#terms').checked) {                                            // terms box NOT checked
                    document.querySelector('#f-terms').classList.add('err');
                    S.run.mistakes.push('Forgot to tick the terms box');
                    bad = true;
                }

                if (document.querySelector('#cvv').value.trim() !== S.run.cvv) {                                           // CVV doesn't match
                    document.querySelector('#cvv').classList.add('err');
                    S.run.mistakes.push('Wrong or missing CVV');
                    bad = true;
                }

                if (bad) { toast('Fix the highlighted fields.'); return; }

                finish(true);
            };
        }

        function updateSeats() {
            const s = S.run.view.sec;
            document.querySelectorAll('.seat').forEach(b => {
                const i = +b.dataset.i;
                b.className = 'seat ' + (S.run.view.sel.includes(i) ? 's' : s.seats[i]);                   // 's' if its in your selection, otherwise s.seats[i] ('a' or 'x')
            });
            document.querySelector('#selc').textContent = `${S.run.view.sel.length} of ${S.run.qty} selected`;
            document.querySelector('#gettix').disabled = S.run.view.sel.length !== S.run.qty;         // true when you haven't picked exactly your quantity
        }

        function updateMap() {
            document.querySelectorAll('.sec').forEach(b => {
                const s = S.run.secs.find(x => x.id === b.dataset.id);
                const frac = Math.floor(s.avail) / s.cap;
                b.querySelector('u').style.width = frac * 100 + '%';           // the bar width, as a percent string
                b.classList.toggle('sold', frac <= 0);                  // add 'sold' when no seats are left
            });
        }

        function tickPick() {
            let lostSel = false;

            S.run.secs.forEach(s => {
                const before = Math.floor(s.avail);
                s.avail = Math.max(0, s.avail - s.cap * 0.012 * Math.random() * 2);     // sell a few seats
                const after = Math.floor(s.avail);

                // if this section's seats exist, mark (before - after) random open seats as taken
                if (s.seats && after < before) {
                    const open = [];
                    s.seats.forEach((v, i) => { if (v === 'a') open.push(i); });        // list of open seat numbers
                    shuffle(open).slice(0, before - after).forEach(i => {
                        s.seats[i] = 'x';
                        // if you're viewing this section and had picked this seat, remove it from your selection
                        if (S.run.view && S.run.view.sec === s && S.run.view.sel.includes(i)) {
                            S.run.view.sel = S.run.view.sel.filter(x => x !== i);         // same filter trick as deselecting
                            lostSel = true;
                        }
                    });
                }
            });

            if (lostSel) toast('A seat you picked was just taken!');
            if (S.run.view) updateSeats(); else updateMap();      // update whichever screen you're on

            // can anyone still buy your quantity anywhere?
            const anyLeft = S.run.secs.some(s => Math.floor(s.avail) >= S.run.qty);
            if (!anyLeft) finish(false, 'Sold out before you locked in seats.');
        }

        function startRun() {
            S.run = {
                d: DIFF[S.settings.diff],             // look up the difficulty object using the chosen setting
                qty: S.settings.qty,                  // the chosen quantity
                mistakes: [],
                code: 'TOUR' + ri(1000, 9999),         // e.g. TOUR4821
                unlocked: false,
                cvv: String(ri(100, 999))
            };
            renderLobby();
        }

        function renderSetup() {

            clearTimers();
            //1. Draw the screen by replacing everything inside #app with new HTML.
            //   Backticks (`) allow a multi-line string.
            app.innerHTML = `
            <div class="card">
                <h1>Ticket Drop Trainer</h1>
                <p>Practice a big onsale until it's muscle memory.</p>
                <button class="diff ${S.settings.diff === 'arena' ? 'on' : ''}" data-v="arena">Arena</button>
                <button class="diff ${S.settings.diff === 'stadium' ? 'on' : ''}" data-v="stadium">Stadium</button>
                <button class="diff ${S.settings.diff === 'chaos' ? 'on' : ''}" data-v="chaos">Chaos</button>
                <p>Tickets:</p>
                ${[1, 2, 3, 4].map(n => `<button class="qty ${S.settings.qty === n ? 'on' : ''}" data-v="${n}">${n}</button>`).join('')}
                <button id="start">Start practice drop</button>
            </div>

            ${historyHTML()}
            `;

            //2. Wire up the button, It only exists now, after the line above ran.
            document.querySelectorAll('.diff').forEach(b => {
                b.onclick = () => { S.settings.diff = b.dataset.v; renderSetup(); };
            });
            document.querySelectorAll('.qty').forEach(b => {                                // 1. '.qty' in place of '.diff'
                b.onclick = () => { S.settings.qty = +b.dataset.v; renderSetup(); };        // 2. set qty 3. the + makes it a number
            });
            document.querySelector('#start').onclick = startRun;
            const ch = document.querySelector('#clearHist');
            if (ch) ch.onclick = () => { store('tdt-history', []); renderSetup(); };       // save an empty list

        }

        function renderLobby() {

            clearTimers();
            let left = S.run.d.lobby;
            //1. Draw the screen by replacing everything inside #app with new HTML.
            //   Backticks (`) allow a multi-line string.
            app.innerHTML = `
            <div class="card">
                <h1>Waiting room</h1>
                <p>${S.run.d.label} &middot; ${S.run.qty} tickets</p>
                <p>Your presale code: <b>${S.run.code}</b> (memorize it!)</p>
                <p>Card CVV: <b>${S.run.cvv}</b></p>
                <div id="cd">${left}</div>
                <button id="quit">Quit</button>
            </div>
            `;

            every(1000, () => {
                left--;                                             // one second passed
                document.querySelector('#cd').textContent = left;   // update just the number, not the whole screen
                if (left <= 0) {
                    S.run.t0 = performance.now();                   // the moment the "sale" starts
                    renderQueue();                                // becomes renderQueue() in the next step
                }
            });

            //2. Wire up the button, It only exists now, after the line above ran.
            document.querySelector('#quit').onclick = renderSetup;
        }

        function finish(ok, reason) {
            clearTimers();
            const r = S.run;
            r.ok = ok;
            r.reason = reason || '';
            r.end = performance.now();

            if (r.coStart) r.coMs = r.end - r.coStart;                      // checkout time, if you made it that far
            const pickMs = r.pickMs != null ? r.pickMs : r.end - r.pickStart;

            r.ctrl = pickMs + (r.coMs || 0);                                // time you actually controlled
            r.score = r.ctrl + r.mistakes.length * 3000;                    // + 3 seconds (3000 ms) per mistake

            r.grade = !ok ? 'X'
                : r.score < 20000 ? 'S'
                    : r.score < 35000 ? 'A'
                        : r.score < 55000 ? 'B'
                            : r.score < 80000 ? 'C'
                                : 'D';

            const hist = load('tdt-history', []);       // past runs, or an empty list the first time
            hist.unshift({                              // unshift = add to the FRONT, so newest comes first
                ts: Date.now(),                         // when (a timestamp)
                diff: r.d.label,
                ok,
                grade: r.grade,
                score: Math.round(r.score)
            });
            store('tdt-history', hist.slice(0, 50));     //keep only the most recent 50

            renderResults();
        }

        function historyHTML() {
            const h = load('tdt-history', []);
            if (!h.length) return '';                   // no runs yet: show nothing

            const wins = h.filter(x => x.ok);
            const best = wins.length ? Math.min(...wins.map(x => x.score)) : null;

            return `
            <div class="card">
                <h3>Your practice history</h3>
                <p>${h.length} runs ・ ${wins.length} got tickets${best != null ? ` ・ best ${(best / 1000).toFixed(10)}s` : ''}</p>
                ${h.slice(0, 8).map(x => `
                <p>${new Date(x.ts).toLocaleDateString()} ・ ${x.diff} ・ <b>${x.ok ? x.grade : 'Missed'}</b> ${x.ok ? '・ ' + (x.score / 1000).toFixed(1) + 's' : ''}</p>
                `).join('')}
                <button id="clearHist">Clear history</button>
            </div>`;
        }

        function renderResults() {

            clearTimers();
            const r = S.run;
            const fmt = ms => (ms / 1000).toFixed(1) + 's';      // 12345 → "12.3s"

            // count each mistake type: { 'Forgot to tick the terms box': 2, ... }
            const groups = {};
            r.mistakes.forEach(m => { groups[m] = (groups[m] || 0) + 1; });

            // one tip per mistake type, no repeats
            const tips = Object.keys(groups).map(m => TIPS[m]).filter(Boolean);
            if (r.snipes) tips.push("Don't hold out for perfect seats. Grab the first good option.");
            if (r.ok && !tips.length) tips.push('Clean run! Try a harder difficulty next.');       // a message for a clean run

            const stat = (label, value) => `<div class="stat"><span>${label}</span><b>${value}</b></div>`;

            //1. Draw the screen by replacing everything inside #app with new HTML.
            //   Backticks (`) allow a multi-line string.
            app.innerHTML = `
            <div class="card" style="text-align:center">
                <div class="grade">${r.ok ? r.grade : '✕'}</div>
                <h3>${r.ok ? '🎉 You got tickets!' : 'Missed it this time'}</h3>
                <p>${r.ok ? r.order.desc : r.reason}</p>
            </div>

            <div class="card">
                <h3>Breakdown</h3>
                <div class="stats">
                    ${stat('Score (lower is better)', r.ok ? fmt(r.score) : "-")}
                    ${stat('Time in line (luck)', fmt(r.pickStart - r.t0))}
                    ${stat('Code unlocked after', r.unlockMs != null ? fmt(r.unlockMs) : 'never')}
                    ${stat('Picking tickets', fmt(r.pickMs != null ? r.pickMs : r.end - r.pickStart))}
                    ${stat('Checkout', r.coMs != null ? fmt(r.coMs) : '_')}
                    ${stat('Beaten by other fans', r.snipes || 0)}
                </div>
            </div>

            <div class="card">
                <h3>Mistakes (${r.mistakes.length})</h3>
                ${Object.entries(groups).map(([m, n]) => `<p>${m} <b>x${n}</b></p>`).join('') || '<p>None!</p>'}
            </div>

            <div class="card">
                <h3>Coach's notes</h3>
                <ul>${tips.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>

            <button id="play-again">Play again</button>
            `;

            //2. Wire up the button, It only exists now, after the line above ran.
            document.querySelector('#play-again').onclick = renderSetup;
        }

        //3. Kick things off when the page loads.
        renderSetup();


    </script>
</body>

</html>
